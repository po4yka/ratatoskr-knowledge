[workspace]
resolver = "3"
members = ["crates/knowledge", "services/knowledge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/ratatoskr-knowledge"

[workspace.dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["ring", "jetstream", "nkeys", "server_2_10"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
jsonschema = { version = "=0.50.0", default-features = false }
pgvector = { version = "=0.4.1", features = ["sqlx"] }
ratatoskr-channel-digest-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-document-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-identifiers = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-github-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-social-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-ai-archive-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
ratatoskr-event-envelope = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "90fca0353e1725ef04c28d71f8de0bedbf0e6b8a" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry"] }
uuid = { version = "=1.24.1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
indexing_slicing = "deny"
string_slice = "deny"

[profile.release]
debug = 1
