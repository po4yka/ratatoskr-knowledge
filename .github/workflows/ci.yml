name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on main, so a date-dependent test or a runner change is caught without a push.
    - cron: "34 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KNOWLEDGE_TEST_DATABASE_URL: postgres://knowledge:knowledge@127.0.0.1:5432/knowledge
      KNOWLEDGE_TEST_NATS_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start the disposable JetStream fixture
        run: >-
          docker run --detach --name knowledge-nats --publish 127.0.0.1:4222:4222
          nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da -js
      - name: Take the nats-server binary from the pinned broker image for the authorized-broker tests
        # The alpine image keeps the executable in /usr/local/bin (only the scratch variant puts it
        # at the filesystem root), so ask the running container where it is instead of hard-coding
        # the layout.
        run: |
          set -euo pipefail
          server_path="$(docker exec knowledge-nats sh -c 'command -v nats-server')"
          mkdir -p "$RUNNER_TEMP/bin"
          docker cp "knowledge-nats:${server_path}" "$RUNNER_TEMP/bin/nats-server"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nats-server" --version
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --doc
      - run: cargo build --workspace --locked --release
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust - the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' DEVELOPMENT.md)
          test "$in_ci" = "$in_doc"

  # Separate from the gate so a new RustSec advisory cannot hide a clippy or test failure behind it.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # The artifact the deployment runs, built for the architecture it runs on, and started once.
  #
  # The gate above certifies an x86-64 build. The target is `aarch64` with glibc 2.36
  # (`ratatoskr-workspace/docs/DEPLOYMENT_TARGET.md`), so this job builds the Dockerfile natively on
  # an arm64 runner and answers the one question the suite cannot: does the thing we ship start on
  # the thing we ship it to. It checks the configuration, applies `schema.sql` and serves readiness
  # against a real pgvector database, takes SIGTERM and exits 0. A native runner, not QEMU: this
  # repository is public, so GitHub's arm64 runners cost nothing, and emulating the build takes hours.
  artifact:
    name: linux/arm64 artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --tag ratatoskr-knowledge:ci .

      # The deployable set, exactly. `export` is the stage `ratatoskr-workspace`'s
      # reusable-release-artifact workflow publishes; its check refuses a binary no unit starts as
      # firmly as a missing one.
      - name: The export stage holds exactly the Knowledge service, for aarch64
        run: |
          set -euo pipefail
          docker buildx build \
            --target export \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --output "type=local,dest=$RUNNER_TEMP/export" .
          actual=$(python3 -c 'import os, sys; print(" ".join(sorted(os.listdir(sys.argv[1]))))' "$RUNNER_TEMP/export")
          if [ "$actual" != "ratatoskr-knowledge-service" ]; then
            echo "::error::the export stage holds '$actual', expected 'ratatoskr-knowledge-service'"
            exit 1
          fi
          file "$RUNNER_TEMP/export/ratatoskr-knowledge-service" | tee /dev/stderr | grep -q 'ARM aarch64'

      # Start, ready, SIGTERM, exit 0, against the real artifact. Knowledge applies its own
      # `schema.sql`, which needs pgvector; ingest and the channel recap stay dormant, so no broker
      # is needed. `--network host` for both, so every address is 127.0.0.1 as in the unit.
      - name: The artifact serves and stops cleanly
        run: |
          set -euo pipefail
          docker run -d --name smoke-db --network host \
            -e POSTGRES_USER=knowledge -e POSTGRES_PASSWORD=knowledge -e POSTGRES_DB=knowledge \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8" \
            pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
          for _ in $(seq 1 60); do
            if docker exec smoke-db pg_isready -h 127.0.0.1 -U knowledge -d knowledge >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/smoke.env" <<'ENV'
          RATATOSKR__ADMIN__LISTEN_ADDRESS=127.0.0.1:9081
          RATATOSKR__API__LISTEN_ADDRESS=127.0.0.1:8091
          RATATOSKR__STORAGE__DATABASE_URL=postgres://knowledge:knowledge@127.0.0.1:5432/knowledge
          RATATOSKR__STORAGE__BLOB_ROOT=/blobs
          RATATOSKR__BLOBS__NOTES_ROOT=/notes
          ENV
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/smoke.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/smoke.env" \
            ratatoskr-knowledge:ci check-config >/dev/null
          docker run -d --name smoke --network host --tmpfs /blobs:mode=1777 \
            --env-file "$RUNNER_TEMP/smoke.env" ratatoskr-knowledge:ci
          ready=no
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9081/ready >/dev/null; then ready=yes; break; fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            docker logs smoke >&2
            echo "::error::Knowledge did not report ready within 60 s"
            exit 1
          fi
          present=$(docker exec smoke-db psql -U knowledge -d knowledge -Atc \
            "select to_regclass('knowledge.notes_files') is not null")
          if [ "$present" != "t" ]; then
            echo "::error::knowledge.notes_files is absent after Knowledge reported itself ready"
            exit 1
          fi
          docker stop -t 40 smoke
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          if [ "$code" != 0 ]; then
            docker logs smoke >&2
            echo "::error::Knowledge exited $code after SIGTERM"
            exit 1
          fi
          docker rm -f smoke smoke-db

  # The artifact of this commit, published only after the gate and the arm64 smoke test have passed
  # on it: `ghcr.io/po4yka/ratatoskr-knowledge:sha-<commit>` with SHA256SUMS, an SPDX SBOM and a
  # build-provenance attestation. The steps live once, in ratatoskr-workspace (openspec
  # `release-artifacts`). A tag that already exists is never moved.
  release-artifact:
    needs: [gate, artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # the OIDC token the attestation is signed with
      attestations: write  # record the attestation against this repository
    uses: po4yka/ratatoskr-workspace/.github/workflows/reusable-release-artifact.yml@75b3ed8cb5f1e0bd638db99126f887b65fa73eb8 # main
